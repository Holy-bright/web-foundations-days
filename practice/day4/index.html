<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day 4 — Live Counter and Dark Mode</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>

    <header>
      <h1>Note Editor</h1>
      <button id="theme-toggle">Dark mode</button>
    </header>

    <main>
      <section>
        <label for="note-text">Write a note</label>
        <textarea id="note-text" rows="6" placeholder="Start typing..."></textarea>
        <p id="char-count">0 / 200 characters</p>
        <p id="word-count">0 words</p>
        <button id="clear-btn">Clear</button>
      </section>
    </main>

  </body>
</html>
