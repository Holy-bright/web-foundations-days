<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>

    <header>
      <div class="header-inner">
        <h1>QuickNotes</h1>
        <p class="tagline">Capture ideas before they disappear.</p>
      </div>
    </header>

    <main>

      <section class="add-section">
        <h2>Add a note</h2>

        <form id="note-form">
          <label for="note-input">Note</label>
          <input
            type="text"
            id="note-input"
            placeholder="What do you want to remember?"
            autocomplete="off"
          />

          <label for="note-category">Category</label>
          <select id="note-category">
            <option value="personal">Personal</option>
            <option value="work">Work</option>
            <option value="study">Study</option>
          </select>

          <button type="submit">Add Note</button>
        </form>

        <p id="error-message" class="error" aria-live="polite"></p>
      </section>

      <section class="notes-section">
        <h2>Your notes</h2>

        <input
          type="search"
          id="search-input"
          placeholder="Search notes..."
          autocomplete="off"
        />

        <p id="note-count">You have no notes yet.</p>

        <ul id="notes-list"></ul>

        <button id="clear-all-btn" class="clear-all-btn">
          Clear all notes
        </button>
      </section>

    </main>

    <footer>
      <p>&copy; 2026 QuickNotes. Built during Web Foundations.</p>
    </footer>

  </body>
</html>
